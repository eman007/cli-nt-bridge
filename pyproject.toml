[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nt8bridge"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4"]

[project.optional-dependencies]
dev = ["pytest>=7"]
report = ["matplotlib>=3"]

[tool.setuptools.packages.find]
include = ["nt8bridge*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
